name: S.O.S mesh and voice validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sos-mesh-voice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Worker syntax
        run: node --check src/cloudflare-mesh-portal-worker.mjs && node --check src/cloudflare-public-worker.mjs
      - name: Test Access assertion forwarding
        run: npm run test:mesh
      - name: Test speech recognition helpers
        run: npm run test:audio
      - name: TypeScript validation
        run: npm run lint
      - name: Production Vite build
        run: npm run build
      - name: Whitespace and patch validation
        run: git diff --check
