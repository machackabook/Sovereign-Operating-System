  <meta property="og:title" content="S.O.S (SOVEREIGN OPERATING SYSTEMS)">
  <meta property="og:description" content="© 2026 Cryptic News. An autonomous, multimodal neural-interface OS serving as a Sovereign Operating System, featuring dynamic, database-driven personality profiles, real-time audio-reactive 3D/4D visual rendering, and sovereign terminal-integrated AI reasoning, optimized for high-performance compute and secure cryptographic auditability.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800;900&display=swap">
  <script>
    // Preserve existing PWA service-worker registrations and caches.
    // Cleanup is versioned and explicit; startup never unregisters all workers.
    if ('serviceWorker' in navigator && (location.hostname === 'crypticnews.org' || location.hostname.endsWith('.crypticnews.org'))) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        window.dispatchEvent(new CustomEvent('gaia:service-worker-status', {
          detail: { registrationCount: regs.length }
        }));
      }).catch(error => console.warn('Service worker status check failed:', error));
    }

    // HMR is disabled in this hosted preview container. Suppress transient Vite WebSocket closed errors.
    window.addEventListener('unhandledrejection', function(event) {
      const msg = event?.reason?.message || String(event?.reason || '');
      if (msg.includes('WebSocket') || msg.includes('websocket')) {
        event.preventDefault();
      }
    });
    window.addEventListener('error', function(event) {
      const msg = event?.message || '';
      if (msg.includes('WebSocket') || msg.includes('websocket')) {
        event.preventDefault();
      }
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
